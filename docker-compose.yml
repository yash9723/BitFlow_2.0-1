# docker-compose.yml — BitFlow (frontend + simulation API). This is the
# supported deployment: a single VPS running Docker Compose.
#
#   Local:           docker compose up -d --build                   → http://localhost:3000
#   VPS with HTTPS:  set DOMAIN (and FRONTEND_BIND=127.0.0.1) in .env, then
#                    docker compose --profile https up -d --build   → https://$DOMAIN
#   Postgres:        add --profile postgres and set DATABASE_URL (see .env.example)
#   Daily backups:   add --profile backup  (writes ./backups, see README)
#   Stop:            docker compose down
#
# setup_server.sh does the VPS steps for you.

# Rotate container logs so a long-running VPS doesn't fill its disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── FastAPI Backend (Python 3.11 + Icarus Verilog compiler) ──────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bitflow-api
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8080"
    environment:
      - PORT=8080
      - TIMEOUT_SECONDS=30
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env, e.g. openssl rand -hex 32}
      - MAX_CONCURRENT_SIMULATIONS=${MAX_CONCURRENT_SIMULATIONS:-4}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Next.js Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./bitflow_frontend
      dockerfile: Dockerfile
    container_name: bitflow-frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:3000:3000"
    # Optional settings (AI provider keys/models, …) come straight from .env so
    # unset ones stay unset and the app's defaults apply.
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
      - BACKEND_URL=http://api:8080
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/dev.db}
      - DIRECT_URL=${DIRECT_URL:-}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env, e.g. openssl rand -hex 32}
      - ADMIN_SECRET=${ADMIN_SECRET:-}   # empty = admin self-registration disabled
      - HTTPS=${HTTPS:-false}            # true behind TLS → Secure session cookies
      - TRUST_PROXY=${TRUST_PROXY:-false} # true only behind Caddy (rate limits use X-Forwarded-For)
    volumes:
      - bitflow-data:/app/data
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false

  # ── Optional: Postgres (--profile postgres) ──────────────────────────────────
  # Reachable only on the compose network (no published port).
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    container_name: bitflow-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      - POSTGRES_DB=bitflow
      - POSTGRES_USER=bitflow
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bitflow-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitflow -d bitflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Optional: automatic HTTPS via Caddy (--profile https) ────────────────────
  # Gets and renews a Let's Encrypt certificate for $DOMAIN (DNS must point here).
  caddy:
    image: caddy:2.8.4
    profiles: ["https"]
    container_name: bitflow-caddy
    restart: unless-stopped
    logging: *default-logging
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to frontend:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - frontend

  # ── Optional: daily database backups (--profile backup) ──────────────────────
  # SQLite: online .backup of the bitflow-data volume. Postgres: pg_dump of
  # DATABASE_URL. Keeps the newest BACKUP_KEEP files in ./backups on the host.
  backup:
    image: postgres:16-alpine          # has pg_dump; the script adds sqlite3
    profiles: ["backup"]
    container_name: bitflow-backup
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["sh", "/backup.sh"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
    volumes:
      - bitflow-data:/data:ro
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro

volumes:
  bitflow-data:
  postgres-data:
  caddy-data:
