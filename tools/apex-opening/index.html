<!doctype html>
<!--
  The BitFlow 3.0 APEX opening: seven silent seconds played once per release on /announcements
  (bitflow_frontend/components/ApexOpening.tsx). Everything in 3D is drawn by assets/film.js.
  The portrait cut is this file with 1920 and 1080 swapped; film.js reframes itself from the root's size.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Jersey 10";
        src: url("assets/fonts/jersey-10.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #050405; }
      #root { position: relative; width: 100%; height: 100%; background: #050405; }
      #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #title {
        position: absolute;
        font: 400 160px/0.9 "Jersey 10", monospace;
        left: 480px;
        top: 205px;
        white-space: nowrap;
      }
      /* Where the page's own title sits on a phone: two lines, from the left gutter. */
      .portrait #title { font-size: 200px; left: 44px; top: 288px; white-space: normal; width: 1000px; }
      #title span { display: inline-block; opacity: 0; }
      #title-name { letter-spacing: 0.025em; }
      .silver {
        background: linear-gradient(180deg, #ffffff 0 48%, #b9bcc4 48% 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(5px 5px 0 #3a3b40);
      }
      .flame {
        background: linear-gradient(180deg, #ffc860 0 32%, #ff7a1a 32% 64%, #e8261b 64% 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(5px 5px 0 #4f0b07);
      }
      #baseline { display: inline-block; width: 0; height: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.4" data-width="1920" data-height="1080">
      <canvas id="stage" class="clip" data-start="0" data-duration="7.4" data-track-index="0"></canvas>
      <h1 id="title" class="clip" data-start="0" data-duration="7.4" data-track-index="1" data-layout-allow-overlap>
        <span id="title-name" class="silver">BitFlow 3.0</span>
        <span id="title-apex" class="flame"><i id="baseline"></i>APEX</span>
      </h1>
    </div>
    <script>
      (window.__hf = window.__hf || {}).buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.film = new Promise((done) => { window.__filmBuilt = done; });
      const root = document.getElementById("root");
      if (+root.dataset.height > +root.dataset.width) root.classList.add("portrait");

      // The voxel letters are already in place when the flat title takes over from them.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title-apex", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 5.4);
      tl.fromTo("#title-name", { opacity: 0, filter: "blur(8px) drop-shadow(5px 5px 0 #3a3b40)" }, { opacity: 1, filter: "blur(0px) drop-shadow(5px 5px 0 #3a3b40)", duration: 0.2, ease: "power4.out" }, 5.35);
      tl.set({}, {}, 7.4);
      window.__timelines["main"] = tl;
    </script>
    <script type="module" src="assets/film.js"></script>
  </body>
</html>
