# Weekly pull requests for dependency updates. Minor and patch updates arrive grouped,
# one PR per ecosystem; major versions come separately so they can be reviewed on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /bitflow_frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
