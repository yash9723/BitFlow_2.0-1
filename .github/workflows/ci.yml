name: CI

on:
  push:
    branches: [main, bitflow-hardening-and-features]
  pull_request:

jobs:
  api:
    name: API tests (pytest + iverilog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iverilog verilator yosys z3 ghdl nextpnr-ice40
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  content:
    name: Content checks (problems, templates, board simulator, contest standings)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitflow_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bitflow_frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iverilog
      - run: npm ci
      - run: npm run check-problems
      - run: npm run check-gate-sim
      - run: npm run check-contests
      - run: npm run check-diagnostics
      - run: npm run check-mutants
      - run: npm run check-waveform-diff
      - run: npm run check-vhdl-starter
      - run: npm run check-bitstream
      - run: npm run check-similarity
      - run: npm run check-dpdp
      - run: npm run check-lessons
      - run: npm run check-radix
      - run: npm run check-plot
      - run: npm run check-logic
      - run: npm run check-fsm
      - run: npm run check-wave
      - run: npm run check-circuit
      - run: npm run check-pnr
      - run: npm run check-riscv
      - run: npm run check-report
      - run: npm run check-palette
      - run: npm run check-numbers
      - run: npm run check-boolexpr
      - run: npm run check-cache
      - run: npm run check-generators
      - run: npm run check-protocol
      - run: npm run check-tbgen
      - run: npm run check-share
      - run: npm run check-policy
      - run: npm run check-constraints
      - run: npm run check-flash
      - run: npm run check-webserial
      - run: npm run check-projects
      - run: npm run check-verilog-lang
      - name: Board Lab lessons (every starter synthesizes and fails a goal) with YoWASP Yosys
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/yw" @yowasp/yosys@0.52.893
          YOWASP_YOSYS="$RUNNER_TEMP/yw/node_modules/@yowasp/yosys/gen/bundle.js" npm run check-lab

  web:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitflow_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bitflow_frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run check-leaks

  e2e:
    name: End-to-end smoke tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitflow_frontend
    env:
      DATABASE_URL: file:./e2e.db
      JWT_SECRET: ci-only-e2e-secret-0123456789abcdef0123456789abcdef
      BACKEND_URL: http://127.0.0.1:8100
      SITE_URL: http://127.0.0.1:3100
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            bitflow_frontend/package-lock.json
            bitflow_frontend/e2e/package-lock.json
      - name: Start the simulation API
        working-directory: .
        run: |
          docker build -q -f Dockerfile.api -t bitflow-api .
          docker run -d --name api -p 127.0.0.1:8100:8080 -e JWT_SECRET="$JWT_SECRET" bitflow-api
      - run: npm ci
      - name: Database (SQLite) with the problems
        run: npx prisma db push --skip-generate && npx prisma generate && npx tsx prisma/seed.ts
      - run: npm run build
      - name: Start the site
        run: |
          nohup npx next start -p 3100 -H 127.0.0.1 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:3100/ && curl -fs -o /dev/null http://127.0.0.1:8100/health && exit 0; sleep 2; done
          cat /tmp/next.log; docker logs api; exit 1
      - name: Smoke tests
        working-directory: bitflow_frontend/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: bitflow_frontend/e2e/playwright-report
          retention-days: 7
