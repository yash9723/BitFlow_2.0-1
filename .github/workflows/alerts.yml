# Every 30 minutes: ask the site how many errors it logged (GET /api/cron/alerts). On a spike the
# job fails, and GitHub emails whoever last changed this schedule (Settings > Notifications > Actions).
# Needs the CRON_SECRET repository secret, the same value as CRON_SECRET in Vercel; without it the
# job fails too, so alerts can't be off unnoticed. It only reads error counts: it never wakes the simulator.
name: Site alerts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check error counts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE: https://bitflowvlsi.tech
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET isn't set, so error alerts are off."; exit 1; fi
          body=$(curl -fsS --max-time 30 -H "Authorization: Bearer $CRON_SECRET" "$SITE/api/cron/alerts?window=30") || {
            echo "::warning::The site didn't answer the alert check."; body='{"alert":true,"total":"?","window":30,"byLocation":[],"down":true}'; }
          echo "$body"
          [ "$(echo "$body" | jq -r .alert)" = "true" ] || exit 0
          echo "$body" | jq -r '
            (if .down then "The site did not answer the alert check.\n\n" else "" end) +
            "\(.total) errors in the last \(.window) minutes (threshold \(.threshold // "?")).\n\n" +
            ([.byLocation[] | "- \(.count) × \(.source) \(.location)"] | join("\n")) +
            "\n\nDetails: /admin → Errors."' | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
