# BitFlow: Zadig preset for FT2232-based FPGA boards (Tang Nano 9K/20K, iCEstick, iCEBreaker,
# Digilent). In Zadig: Device -> Load Preset Device, pick this file, keep "WinUSB", click Install.
# It targets only the programming interface (00); the serial port (01) keeps its driver.
[device]
  Description = "BitFlow FPGA programmer"
  VID = 0x0403
  PID = 0x6010
  MI = 0x00
